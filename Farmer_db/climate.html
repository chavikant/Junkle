<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Climate Updates</title>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(120deg, #4cafef, #8ed1fc);
      min-height: 100vh; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: start;
    }
    h2 { margin-top: 20px; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
    .input-group {
      margin: 20px;
    }
    input {
      padding: 10px; border-radius: 6px;
      border: none; font-size: 1rem;
      width: 200px;
    }
    button {
      padding: 10px 16px; border: none;
      border-radius: 6px; background: #ff9800;
      color: white; cursor: pointer; font-size: 1rem;
      margin-left: 10px;
      transition: background 0.3s ease;
    }
    button:hover { background: #fb8c00; }
    .weather-card {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(6px);
      border-radius: 12px; padding: 20px;
      max-width: 300px; margin-top: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .weather-card h3 { margin-bottom: 10px; }
    .temp { font-size: 2rem; font-weight: bold; }
    .details { margin-top: 10px; line-height: 1.6; }
  </style>
</head>
<body>
  <h2>🌦 Climate Updates</h2>
  <div class="input-group">
    <input type="text" id="locationInput" placeholder="Enter your location">
    <button onclick="getWeather()">Check</button>
  </div>

  <div id="weatherResult" class="weather-card" style="display:none;"></div>

  <script>
    async function getWeather() {
      const loc = document.getElementById('locationInput').value.trim();
      if (!loc) {
        alert('Please enter a location.');
        return;
      }
      const apiKey = '66dbe002929c5ac17ae3b03b035d6955'; // Replace with your API key
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(loc)}&appid=${apiKey}&units=metric`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Location not found');
        const data = await response.json();

        // Extract weather info
        const temp = data.main.temp;
        const condition = data.weather[0].main;
        const humidity = data.main.humidity;
        const wind = data.wind.speed;

        // Change background based on condition
        let bg;
        switch(condition.toLowerCase()) {
          case 'rain': bg = 'linear-gradient(120deg,#4e54c8,#8f94fb)'; break;
          case 'clouds': bg = 'linear-gradient(120deg,#bdc3c7,#2c3e50)'; break;
          case 'clear': bg = 'linear-gradient(120deg,#56ccf2,#2f80ed)'; break;
          case 'snow': bg = 'linear-gradient(120deg,#83a4d4,#b6fbff)'; break;
          default: bg = 'linear-gradient(120deg,#4cafef,#8ed1fc)';
        }
        document.body.style.background = bg;

        // Display weather info
        const resultDiv = document.getElementById('weatherResult');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
          <h3>${data.name}, ${data.sys.country}</h3>
          <div class="temp">${temp}°C</div>
          <div>${condition}</div>
          <div class="details">
            Humidity: ${humidity}%<br>
            Wind Speed: ${wind} m/s
          </div>
        `;
      } catch (error) {
        alert('Unable to fetch weather: ' + error.message);
      }
    }
  </script>
</body>
</html>
